name: Build PWA & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build Vite PWA
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android App Icons
        run: |
          # Copy the PWA icon as Capacitor assets source, then generate
          mkdir -p resources
          cp public/icons/icon-1024.png resources/icon.png 2>/dev/null || cp public/icons/icon-512.png resources/icon.png
          npx @capacitor/assets@latest generate --android --icon
        continue-on-error: false

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Nova AI, OU=Developer, O=App, L=City, ST=State, C=ID"

      - name: Patch Signing Config
        run: |
          cd android
          python3 << 'PYEOF'
          with open('app/build.gradle', 'r') as f:
              lines = f.readlines()

          result = []
          for line in lines:
              if 'buildTypes {' in line and 'android.buildTypes' not in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  result.append(indent + 'signingConfigs {\n')
                  result.append(indent + '    release {\n')
                  result.append(indent + '        storeFile file(\'release.keystore\')\n')
                  result.append(indent + '        storePassword \'android\'\n')
                  result.append(indent + '        keyAlias \'upload\'\n')
                  result.append(indent + '        keyPassword \'android\'\n')
                  result.append(indent + '    }\n')
                  result.append(indent + '}\n')
                  result.append('\n')
                  result.append(line)
              elif line.strip() == 'release {' or line.strip().startswith('release {'):
                  result.append(line)
                  indent = line[:len(line) - len(line.lstrip())]
                  result.append(indent + '    signingConfig signingConfigs.release\n')
              else:
                  result.append(line)

          with open('app/build.gradle', 'w') as f:
              f.writelines(result)
          print("Patched build.gradle with signing config")
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Prepare APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/NovaAI-Assistant-v1.0-release.apk
          cd build_output
          zip NovaAI-Assistant-v1.0-release.zip NovaAI-Assistant-v1.0-release.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "Nova AI PWA v1.${{ github.run_number }}"
          body: |
            Nova AI Assistant - PWA APK Build
            - APK: NovaAI-Assistant-v1.0-release.apk
            - ZIP: NovaAI-Assistant-v1.0-release.zip
            - Package ID: com.novaai.assistant
            - Type: PWA (Capacitor)
          files: |
            build_output/NovaAI-Assistant-v1.0-release.apk
            build_output/NovaAI-Assistant-v1.0-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
