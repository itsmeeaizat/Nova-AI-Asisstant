name: Build PWA & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Vite PWA
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Setup Capacitor
        run: |
          npx cap init NovaAIAssistant com.novaai.assistant --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate Release Keystore
        run: |
          if [ ! -f "android/app/my-upload-key.jks" ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -v \
              -keystore android/app/my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Nova AI, OU=Developer, O=App, L=City, ST=State, C=ID"
          fi

      - name: Configure Signing
        run: |
          cat > android/app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          
          android {
              namespace "com.novaai.assistant"
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.novaai.assistant"
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              signingConfigs {
                  release {
                      storeFile file('my-upload-key.jks')
                      storePassword 'android'
                      keyAlias 'upload'
                      keyPassword 'android'
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation project(':capacitor-android')
          }
          GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"

      - name: Prepare APK
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/release/app-release.apk build_output/NovaAI-Assistant-v1.0-release.apk
          cd build_output
          zip NovaAI-Assistant-v1.0-release.zip NovaAI-Assistant-v1.0-release.apk
          cd ..

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "Nova AI PWA v1.${{ github.run_number }}"
          body: |
            🚀 **Nova AI Assistant - PWA APK Build**
            - APK: NovaAI-Assistant-v1.0-release.apk
            - ZIP: NovaAI-Assistant-v1.0-release.zip
            - Package ID: com.novaai.assistant
            - Type: PWA (Capacitor)
          files: |
            build_output/NovaAI-Assistant-v1.0-release.apk
            build_output/NovaAI-Assistant-v1.0-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
